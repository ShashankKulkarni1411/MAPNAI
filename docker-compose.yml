# MAPNAI — full project in Docker (identical package versions on every machine).
#
#   docker compose build                           build the app image (first time / after code changes)
#   docker compose run --rm mapnai                 run ingestion + Agents 1-4 once
#   docker compose run --rm mapnai python run_mapnai.py --check    check services, models, keys
#   docker compose run --rm mapnai python -m pytest                run the tests
#   docker compose up -d mongo neo4j               start only the local databases
#   docker compose down                            stop everything (data is kept in named volumes)
#
# Secrets come from .env (never baked into the image).
# MongoDB: the app uses MONGO_URI from .env (e.g. the Atlas cluster). To use the local
#   "mongo" container instead, set MONGO_URI_DOCKER=mongodb://mongo:27017 in .env.
# Neo4j: the app talks to the "neo4j" container below. Its password is NEO4J_PASSWORD from
#   .env (at least 8 characters); if unset, a local-only development default is used.

services:
  mapnai:
    build: .
    image: mapnai:latest
    container_name: mapnai-app
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI_DOCKER:-${MONGO_URI:-mongodb://mongo:27017}}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mapnai-local-dev}
    volumes:
      - ./models:/app/models      # Agent 2 classifier (auto-downloaded), optional Agent 1 BERT NER
      - ./data:/app/data          # FAISS index + metadata
      - ./logs:/app/logs
    depends_on:
      - neo4j
    restart: "no"

  mongo:
    image: mongo:7
    container_name: mapnai-mongo
    ports:
      - "27017:27017"      # from the host: MONGO_URI=mongodb://localhost:27017
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: mapnai-neo4j
    ports:
      - "7474:7474"        # browser UI: http://localhost:7474
      - "7687:7687"        # from the host: NEO4J_URI=bolt://localhost:7687
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mapnai-local-dev}
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  neo4j-data:
