# MAPNAI databases for local development.
#   docker compose up -d      start MongoDB + Neo4j in the background
#   docker compose down       stop them (data is kept in the named volumes)
# Neo4j's password comes from NEO4J_PASSWORD in .env (at least 8 characters).

services:
  mongo:
    image: mongo:7
    container_name: mapnai-mongo
    ports:
      - "27017:27017"      # MONGO_URI=mongodb://localhost:27017
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: mapnai-neo4j
    ports:
      - "7474:7474"        # browser UI: http://localhost:7474
      - "7687:7687"        # NEO4J_URI=bolt://localhost:7687
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  neo4j-data:
